version: "3.7"
services:
  tournamentml-app:
    build:
      args:
        user: tournamentml
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: tournamentml
    container_name: tournamentml-app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - my-networks

  tournamentml-nginx:
    image: nginx:alpine
    container_name: tournamentml-nginx
    restart: unless-stopped
    ports:
      - 8005:80
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d/
    networks:
      - my-networks

networks:
  my-networks:
    driver: bridge
    name: my-networks
    external: true